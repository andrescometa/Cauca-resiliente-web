# Configuración de despliegue en Netlify — Cauca Resiliente (panel web)
# El plan gratuito es suficiente: build estático, sin funciones serverless.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# La web es una SPA: cualquier ruta debe servir index.html.
# Así, al recargar o entrar directo a una ruta, Netlify no devuelve 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
